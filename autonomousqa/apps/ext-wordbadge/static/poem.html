<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Harbour Poem</title></head>
<body>
<header><h1>Harbour Poem</h1></header>
<main>
  <p>Fog rolls in —</p>
  <p>the harbour bell answers slowly</p>
  <p>counting ships that never left</p>
  <p>salt wind combs the empty pier</p>
  <p>and dawn — unhurried — forgives night</p>
</main>
<footer>Footer decoy words that the badge must ignore entirely.</footer>
</body>
</html>
