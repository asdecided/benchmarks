name: CI

# Gate every per-tool benchmark on every push to main and every pull request.
# AsDecided is installed from its checksum-verified native release and consumed as an external
# CLI on PATH (DG-ADR-0001) — the suite imports no engine code. Re-baselining
# is human-gated: no step here may ever pass --update-baseline (a test
# enforces this).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmarks:
    name: benchmarks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install AsDecided (external CLI on PATH, never an import)
        run: bash .github/scripts/install-asdecided.sh 0.26.0

      - name: Install the harness
        run: pip install -e ".[dev]"

      - name: Validate every fixture corpus
        run: |
          for bench in search-artifacts find-decisions get-artifact get-related get-summary sentry; do
            decided validate "$bench/corpus"
          done

      - name: Run the benchmark battery
        run: python -m pytest -q

      - name: Gate every benchmark against its committed baseline
        run: |
          for bench in search-artifacts find-decisions get-artifact get-related get-summary sentry; do
            python "$bench/run.py" --check
          done

      - name: Verify Sentry at the supported 5,000-decision scale
        run: python sentry/run.py --scale --corpus-size 5000
