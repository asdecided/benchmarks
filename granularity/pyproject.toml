# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rac-benchmarks-granularity"
version = "0.1.0"
description = "Granularity evidence member for RAC: one deterministic source of truth rendered both as per-file artifacts and as monolithic canon documents, queried by the same deterministic set and scored by the same deterministic metrics, to measure the retrieval impact of artifact granularity (the ADR-010 claim). Drives rac only as an external CLI/MCP server on PATH (DG-ADR-0001); never a merge gate (ADR-066/ADR-097)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# Stdlib-only: no engine imports (rac is an external CLI/MCP server on PATH),
# no embeddings, no network, no third-party runtime dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["_model", "build_corpus", "build_queries", "bm25", "arms", "run"]
