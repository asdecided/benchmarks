[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisiongrounding"
version = "0.1.0"
description = "A reproducible benchmark for decision-grounding: does a deterministic grounding layer make a coding agent adhere to prior decisions better than context-dump, naive RAG, or a memory layer — and at what corpus size?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# Core spine is stdlib-only so the demo runs offline with no install.
dependencies = []

[project.optional-dependencies]
# Strict JSON Schema (Draft 2020-12) validation. Without it the loader falls
# back to a built-in required-key check.
schema = ["jsonschema>=4.20"]
# PNG crossover chart. Without it the chart renders as a pure-Python SVG.
chart = ["matplotlib>=3.7"]
# Real benchmark backends: the pinned Claude answering model (anthropic) and
# Voyage embeddings (Anthropic's recommended embedding provider — Anthropic has
# no embeddings endpoint). Replaces the offline stubs. Floors are set to
# verified-working versions; the exact runtime versions are recorded in every
# report's `backend_versions`, which is the reproducibility pin.
real = ["anthropic>=0.109", "voyageai>=0.4"]
# Local, offline-capable embeddings alternative to Voyage.
local-embeddings = ["sentence-transformers>=2.2"]
# Local web UI (`decisiongrounding ui`). Optional and lazily imported so the
# core stays dependency-free; the page needs no frontend build step.
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
# The stable rac arm additionally needs AsDecided Core's `decided` CLI on PATH
# (or DECIDED_BIN). It is the external system under test, not a Python
# dependency (ADR-0001), so it is not listed here.
# Test runner.
dev = ["pytest>=7"]

[project.scripts]
decisiongrounding = "runner.cli:main"

[tool.setuptools]
packages = ["providers", "scenarios", "scoring", "runner", "ingest", "util"]

[tool.setuptools.package-data]
# The editable dashboard HTML shell ships with the package (the UI loads it).
runner = ["templates/*.html"]
